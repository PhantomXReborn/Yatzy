<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yatzy — Server Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <div class="logo">🎲 Yatzy</div>
      <div class="roll-counter" id="rollCounter">Ready to Roll</div>
    </header>

    <!-- Player Panel (rendered dynamically by app.js) -->
    <section class="player-panel" id="playerPanel"></section>

    <section class="dice-tray">
      <div class="dice-row" id="diceContainer"></div>

      <div class="controls" style="display: flex; gap: 1rem;">
        <button class="roll-btn" id="rollBtn">Roll Dice</button>
      </div>

      <div class="tech-tags">
        <span class="tech-tag">HTML5</span>
        <span class="tech-tag">CSS3</span>
        <span class="tech-tag">JavaScript</span>
      </div>
    </section>

    <section class="scorecard">
      <h2>Scorecard</h2>
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="scorecardBody"></tbody>
        <tfoot>
          <tr class="total">
            <td>Total</td>
            <td id="totalScoreDisplay">0</td>
          </tr>
        </tfoot>
      </table>
    </section>

    <footer class="status-bar">
      <span>🎲 Yatzy v1.0 · 5 dice · 13 categories</span>
      <!-- Added High Score to the initial text -->
      <span id="statusText">🏆 High Score: 0 · 👤 Player 1's turn</span>
    </footer>
  </div>

  <!-- Modal for Scoring AND Game Over -->
  <div class="category-modal" id="categoryModal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <!-- Only the client controller is loaded. -->
  <script src="js/app.js"></script>
</body>
</html>
