<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yatzy — Server Edition</title>

  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css-lab7/style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <div class="logo">🎲 Yatzy
        <small style="font-size:.55em;color:var(--text-muted);letter-spacing:.5px;">(server)</small>
      </div>
      <div class="roll-counter" id="rollCounter">Ready</div>
    </header>

    <section class="player-panel" id="playerPanel" style="grid-template-columns: 1fr;"></section>

    <section class="dice-tray">
      <div class="dice-row" id="diceContainer"></div>

      <div class="controls" style="display:flex;gap:1rem;">
        <button class="roll-btn" id="rollBtn" disabled>Roll Dice</button>
      </div>

      <div class="tech-tags">
        <span class="tech-tag">Node.js</span>
        <span class="tech-tag">Express</span>
        <span class="tech-tag">Fetch API</span>
      </div>
    </section>

    <section class="scorecard">
      <h2>Scorecard</h2>
      <table>
        <thead>
          <tr><th>Category</th><th>Score</th></tr>
        </thead>
        <tbody id="scorecardBody"></tbody>
        <tfoot>
          <tr class="total">
            <td>Total</td>
            <td id="totalScoreDisplay">0</td>
          </tr>
        </tfoot>
      </table>
    </section>

    <footer class="status-bar">
      <span>🎲 Yatzy · server-managed</span>
      <span id="statusText">Connecting…</span>
    </footer>
  </div>

  <div class="category-modal" id="categoryModal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <!-- Single UI controller; all game logic lives on the server -->
  <script src="js/app.js"></script>
</body>
</html>
