<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yatzy Mock-up</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       DESIGN TOKENS
       All colors, fonts, radii, and shadows from the design system.
       Declared once here and reused everywhere below.
       ============================================================ */
    :root {
      /* Backgrounds (felt table) */
      --felt-dark: #0d3b2e;
      --felt: #14523f;
      --felt-light: #1a6b52;
      --felt-highlight: #2d8a6e;

      /* Primary accents (gold) */
      --gold: #d4a843;
      --gold-light: #e8c76a;
      --gold-dark: #b08a2e;
      --cream: #f5f0e1;

      /* Secondary accents */
      --red: #c0392b;
      --red-light: #e74c3c;
      --blue: #2980b9;
      --blue-light: #3498db;

      /* Structural */
      --wood: #5d3a1a;
      --wood-light: #7a4e25;
      --stone: #2c2c2c;
      --stone-light: #4a4a4a;

      /* Text */
      --text: #f5f0e1;
      --text-muted: #a8b5a0;
      --text-dark: #1a1a1a;

      /* Typography */
      --font-display: 'Montserrat', 'Helvetica Neue', sans-serif;
      --font-body: 'Open Sans', -apple-system, sans-serif;
      --font-mono: 'Fira Code', 'Courier New', monospace;

      /* Radii */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-pill: 50px;
      --radius-full: 50%;

      /* Shadows & Glows */
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.3);
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      --glow-gold: 0 0 15px rgba(212,168,67,0.4);
      --glow-red: 0 0 15px rgba(192,57,43,0.4);
      --glow-blue: 0 0 15px rgba(41,128,185,0.4);
      --inner-shadow: inset 0 2px 4px rgba(0,0,0,0.2);

      /* Motion */
      --ease-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================================
       GLOBAL RESET
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: radial-gradient(circle at center, var(--felt) 0%, var(--felt-dark) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    /* ============================================================
       GAME CONTAINER
       Two-column grid: dice tray (left) + scorecard (right).
       Collapses to one column below 1024px for tablet/mobile.
       ============================================================ */
    .game-container {
      max-width: 1200px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      position: relative;
      z-index: 1;
    }

    /* ============================================================
       HEADER / GAME BAR
       Frosted glass bar with logo left, player info right.
       ============================================================ */
    .game-header {
      grid-column: 1 / -1;
      background: rgba(13, 59, 46, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 168, 67, 0.3);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(212, 168, 67, 0.5);
    }

    .player-indicator {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      background: var(--blue);
      color: var(--cream);
      padding: 0.4rem 1rem;
      border-radius: var(--radius-pill);
    }

    /* ============================================================
       DICE TRAY
       Wood-textured panel holding the five dice and roll button.
       ============================================================ */
    .dice-tray {
      background: linear-gradient(135deg, var(--wood) 0%, #3d2510 100%);
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .dice-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ------------------------------------------------------------
       DIE
       60x60 rounded square with a 3x3 CSS Grid for pips.
       The `data-value` attribute controls which pips are visible.
       ------------------------------------------------------------ */
    .die {
      width: 60px;
      height: 60px;
      background: var(--cream);
      border: 2px solid var(--gold);
      border-radius: var(--radius-lg);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      place-items: center;
      box-shadow: var(--shadow), var(--inner-shadow);
      transition: transform 0.2s var(--ease-bounce),
                  box-shadow 0.2s var(--ease-smooth);
      cursor: pointer;
    }

    .die:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow), var(--glow-gold);
    }

    .die.held {
      border-color: var(--gold-light);
      box-shadow: var(--shadow), var(--glow-gold);
    }

    .pip {
      width: 10px;
      height: 10px;
      background: var(--stone);
      border-radius: var(--radius-full);
    }

    /* ------------------------------------------------------------
       PIP LAYOUTS
       Each face positions its pips on the 3x3 grid.
       grid-area: row-start / column-start;
       ------------------------------------------------------------ */
    .die[data-value="1"] .pip:nth-child(1) { grid-area: 2 / 2; }

    .die[data-value="2"] .pip:nth-child(1) { grid-area: 1 / 1; }
    .die[data-value="2"] .pip:nth-child(2) { grid-area: 3 / 3; }

    .die[data-value="3"] .pip:nth-child(1) { grid-area: 1 / 1; }
    .die[data-value="3"] .pip:nth-child(2) { grid-area: 2 / 2; }
    .die[data-value="3"] .pip:nth-child(3) { grid-area: 3 / 3; }

    .die[data-value="4"] .pip:nth-child(1) { grid-area: 1 / 1; }
    .die[data-value="4"] .pip:nth-child(2) { grid-area: 1 / 3; }
    .die[data-value="4"] .pip:nth-child(3) { grid-area: 3 / 1; }
    .die[data-value="4"] .pip:nth-child(4) { grid-area: 3 / 3; }

    .die[data-value="5"] .pip:nth-child(1) { grid-area: 1 / 1; }
    .die[data-value="5"] .pip:nth-child(2) { grid-area: 1 / 3; }
    .die[data-value="5"] .pip:nth-child(3) { grid-area: 2 / 2; }
    .die[data-value="5"] .pip:nth-child(4) { grid-area: 3 / 1; }
    .die[data-value="5"] .pip:nth-child(5) { grid-area: 3 / 3; }

    .die[data-value="6"] .pip:nth-child(1) { grid-area: 1 / 1; }
    .die[data-value="6"] .pip:nth-child(2) { grid-area: 1 / 3; }
    .die[data-value="6"] .pip:nth-child(3) { grid-area: 2 / 1; }
    .die[data-value="6"] .pip:nth-child(4) { grid-area: 2 / 3; }
    .die[data-value="6"] .pip:nth-child(5) { grid-area: 3 / 1; }
    .die[data-value="6"] .pip:nth-child(6) { grid-area: 3 / 3; }

    /* ============================================================
       BUTTONS
       Gold gradient pill button with hover lift + glow.
       ============================================================ */
    .roll-btn {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      color: var(--stone);
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s var(--ease-smooth),
                  box-shadow 0.2s var(--ease-smooth);
    }

    .roll-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow), var(--glow-gold);
    }

    .roll-btn:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }

    .roll-btn:disabled {
      background: var(--stone-light);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ============================================================
       SCORECARD
       Cream table with felt-green header and alternating rows.
       ============================================================ */
    .scorecard {
      background: var(--cream);
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 1.5rem;
      color: var(--stone);
    }

    .scorecard h2 {
      font-family: var(--font-display);
      color: var(--felt);
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .scorecard table {
      width: 100%;
      border-collapse: collapse;
    }

    .scorecard th,
    .scorecard td {
      padding: 0.5rem;
      text-align: left;
      border-bottom: 1px solid rgba(44, 44, 44, 0.1);
    }

    .scorecard th {
      font-family: var(--font-display);
      color: var(--cream);
      background: var(--felt-light);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .scorecard td:last-child {
      text-align: right;
      font-family: var(--font-mono);
      font-weight: 600;
    }

    /* Row modifier classes */
    .scorecard tr.active {
      background: var(--gold);
      cursor: pointer;
      transition: background 0.2s var(--ease-smooth);
    }

    .scorecard tr.active:hover {
      background: var(--gold-light);
    }

    .scorecard tr.yatzy {
      background: rgba(192, 57, 43, 0.15);
    }

    .scorecard tr.total {
      background: var(--gold);
      font-weight: 700;
    }

    /* ============================================================
       FOOTER / STATUS BAR
       Frosted glass bar with mono-font status info.
       ============================================================ */
    .status-bar {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(13, 59, 46, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 168, 67, 0.2);
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
    }

    /* ============================================================
       RESPONSIVE
       Desktop > 1024px: two-column layout
       Tablet  <= 1024px: stacked layout
       Mobile  <= 768px: smaller dice
       Phone   <= 480px: smallest dice
       ============================================================ */
    @media (max-width: 1024px) {
      .game-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .die {
        width: 50px;
        height: 50px;
      }
      .pip {
        width: 8px;
        height: 8px;
      }
      .scorecard {
        font-size: 0.875rem;
      }
    }

    @media (max-width: 480px) {
      .die {
        width: 40px;
        height: 40px;
      }
      .pip {
        width: 6px;
        height: 6px;
      }
      .game-container {
        padding: 0 0.75rem;
        gap: 1rem;
      }
      .status-bar {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">

    <!-- ============================================================
         HEADER
         Logo + current player + roll counter
         ============================================================ -->
    <header class="game-header">
      <div class="logo">🎲 Yatzy</div>
      <div class="player-indicator">Player 1 · Roll 1/3</div>
    </header>

    <!-- ============================================================
         DICE TRAY
         Five dice showing faces 1–5 (mock-up only).
         In the real game, JavaScript will set data-value dynamically.
         ============================================================ -->
    <section class="dice-tray">
      <div class="dice-row">
        <div class="die" data-value="1"><span class="pip"></span></div>
        <div class="die" data-value="2"><span class="pip"></span><span class="pip"></span></div>
        <div class="die" data-value="3"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        <div class="die" data-value="4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        <div class="die" data-value="5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      </div>
      <button class="roll-btn">Roll Dice</button>
    </section>

    <!-- ============================================================
         SCORECARD
         13 categories + total, with active/yatzy/total row styles.
         ============================================================ -->
    <section class="scorecard">
      <h2>Scorecard</h2>
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Ones</td><td>3</td></tr>
          <tr><td>Twos</td><td>6</td></tr>
          <tr><td>Threes</td><td>—</td></tr>
          <tr><td>Fours</td><td>—</td></tr>
          <tr><td>Fives</td><td>—</td></tr>
          <tr><td>Sixes</td><td>—</td></tr>
          <tr class="active"><td>Three of a Kind</td><td>—</td></tr>
          <tr><td>Four of a Kind</td><td>—</td></tr>
          <tr><td>Full House</td><td>—</td></tr>
          <tr><td>Small Straight</td><td>—</td></tr>
          <tr><td>Large Straight</td><td>—</td></tr>
          <tr class="yatzy"><td>Yatzy</td><td>50</td></tr>
          <tr><td>Chance</td><td>—</td></tr>
          <tr class="total"><td>Total</td><td>59</td></tr>
        </tbody>
      </table>
    </section>

    <!-- ============================================================
         FOOTER
         Status info: version, dice count, high score, turn.
         ============================================================ -->
    <footer class="status-bar">
      <span>🎲 Yatzy v1.0 · 5 dice · 13 categories</span>
      <span>🏆 High Score: 245 · 👤 Player 1's turn</span>
    </footer>

  </div>
</body>
</html>
